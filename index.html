<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard do Investidor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f3f6fa;
    color:#1f2937;
    padding:25px;
}

h1{
    font-size:42px;
    margin-bottom:10px;
    color:#0f172a;
}

#dataAtualizacao{
    font-weight:bold;
    color:#2563eb;
}

button{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:
        0 8px 20px rgba(0,0,0,.05);
}

.card h3{
    margin-bottom:20px;
    color:#111827;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #e5e7eb;
}

.item:last-child{
    border-bottom:none;
}

.valor{
    font-weight:bold;
}

.positivo{
    color:#16a34a;
}

.negativo{
    color:#dc2626;
}

#resumo{
    font-size:16px;
    line-height:1.6;
}

.topo{
    background:linear-gradient(
    135deg,
    #1e3a8a,
    #2563eb
    );

    color:white;
    padding:30px;
    border-radius:18px;
    margin-bottom:25px;

    box-shadow:
    0 10px 30px rgba(37,99,235,.25);
}
.topo h1{
    color:white;
}

.topo #dataAtualizacao{
    color:#dbeafe;
}

.rodape{
    margin-top:25px;
    color:#6b7280;
    font-size:13px;
}

</style>
</head>

<body>

<div class="topo">

<h1>📊 Dashboard do Investidor</h1>

<p style="margin-top:10px;">
Última atualização:
<span id="dataAtualizacao"></span>
</p>

<br>

<button onclick="atualizar()">
🔄 Atualizar Dados
</button>

</div>

<br><br>

<div class="grid">

<div class="card">
<h3>🌎 Índices</h3>

<div class="item">IBOVESPA: <span id="ibov">132.500</span>
<div class="item">IFIX: <span id="ifix">--</span></div>
<div class="item">S&P 500: <span id="sp500">--</span></div>

</div>

<div class="card">
<h3>💱 Moedas</h3>

<div class="item">Dólar: <span id="dolar">--</span></div>
<div class="item">Euro: <span id="euro">--</span></div>
<div class="item">Bitcoin: <span id="btc">--</span></div>

</div>

<div class="card">
<h3>📈 Ações</h3>

<div class="item">RAIZ4: <span id="raiz4">--</span></div>
<div class="item">PETR4: <span id="petr4">--</span></div>
<div class="item">VALE3: <span id="vale3">--</span></div>
<div class="item">ITUB4: <span id="itub4">--</span></div>

</div>

<div class="card">
<h3>🏢 FIIs</h3>

<div class="item">XPCA11: <span id="xpca11">--</span></div>
<div class="item">HGLG11: <span id="hglg11">--</span></div>
<div class="item">XPLG11: <span id="xplg11">--</span></div>

</div>

</div>

<div class="card">
<h3>📰 Resumo do Mercado</h3>

<p id="resumo">
Clique em Atualizar Dados.
</p>
</div>

<script>
 
async function atualizar(){
 
document.getElementById("dataAtualizacao").innerText =
new Date().toLocaleString('pt-BR');
 
document.getElementById("resumo").innerText =
"Dashboard carregado automaticamente.";
 
document.getElementById("ibov").innerText = "130.000";
 
document.getElementById("ifix").innerText = "3.400";
 
try {

    const resposta = await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
    );

    const dados = await resposta.json();

    document.getElementById("dolar").innerText =
        Number(dados.USDBRL.bid).toFixed(2);

    document.getElementById("euro").innerText =
        Number(dados.EURBRL.bid).toFixed(2);

    document.getElementById("btc").innerText =
        Number(dados.BTCBRL.bid).toLocaleString('pt-BR');

}
catch (erro) {

    console.log("Erro ao consultar API", erro);

}
 
document.getElementById("raiz4").innerText = "2,18";
 
document.getElementById("petr4").innerText = "38,50";
 
document.getElementById("vale3").innerText = "57,80";
 
document.getElementById("itub4").innerText = "41,30";
 
document.getElementById("xpca11").innerText = "105,20";
 
document.getElementById("hglg11").innerText = "160,00";
 
document.getElementById("xplg11").innerText = "101,50";
 
}
 
window.onload = atualizar;
 
</script>
       
</body>
</html>
